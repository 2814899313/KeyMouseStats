name: v4 dotnet

# v4 独立 CI：只构建 src/ 下的新解决方案，不触碰 v3 的 build.yml / release.yml。
on:
  push:
    branches: [v4, main]
    paths:
      - "src/**"
      - "tests/Kms*/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "KeyMouseStats.slnx"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/Kms*/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "KeyMouseStats.slnx"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KeyMouseStats.slnx

      - name: Build
        run: dotnet build KeyMouseStats.slnx -c Release --no-restore

      # 门禁只跑「逻辑 / 数据 / 输入 / 架构」四组 —— 与 release-v4.yml 口径一致。
      # 视觉黄金图依赖渲染环境(字体、DPI、无 GPU),在 CI 里天然与本地不同,
      # 按 docs/v4-acceptance.md 属于本地人工验收项;下面单独一步照跑,但不阻塞。
      - name: Test (logic / data / input / architecture)
        run: >-
          dotnet test KeyMouseStats.slnx -c Release --no-build
          --filter "FullyQualifiedName!~Kms.Golden.Tests"
          --logger "trx;LogFileName=v4.trx"
          --results-directory artifacts/test-results

      - name: Test (visual baselines, informational only)
        continue-on-error: true
        run: >-
          dotnet test KeyMouseStats.slnx -c Release --no-build
          --filter "FullyQualifiedName~Kms.Golden.Tests"
          --logger "trx;LogFileName=v4-golden.trx"
          --results-directory artifacts/test-results

      - name: Verify fixtures
        run: dotnet run --project tools/scrub-fixtures -c Release --no-build -- verify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v4-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
