name: Release v4

on:
  push:
    tags:
      - 'v4.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KeyMouseStats.slnx

      - name: Build
        run: dotnet build KeyMouseStats.slnx -c Release --no-restore

      # 视觉 golden 依赖本机字体 / DPI，CI runner 上不稳定；发布门禁只卡
      # 逻辑 / 数据 / 输入 / 架构四组，视觉基线按 docs/v4-acceptance.md 本地人工验收。
      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          $log = "artifacts/test-results/dotnet-test.log"
          $args = @(
            "test", "KeyMouseStats.slnx", "-c", "Release", "--no-build",
            "--filter", "FullyQualifiedName!~Kms.Golden.Tests",
            "--logger", "console;verbosity=detailed",
            "--logger", "trx;LogFileName=v4-release.trx",
            "--results-directory", "artifacts/test-results"
          )
          & dotnet @args 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $failures = Select-String -Path $log -Pattern '\[FAIL\]|Failed!|错误消息|期望:|实际:|第 \d+ 行|XunitException' -ErrorAction SilentlyContinue
            if ($failures) {
              $failures | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            } else {
              Write-Host "::error::dotnet test failed; see artifacts/test-results/dotnet-test.log"
            }
            exit $code
          }

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v4-release-test-log
          path: artifacts/test-results/dotnet-test.log
          if-no-files-found: ignore

      - name: Verify fixtures
        run: dotnet run --project tools/scrub-fixtures -c Release --no-build -- verify

      - name: Publish v4
        shell: pwsh
        run: >
          dotnet publish src/Kms.App/Kms.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish-v4

      - name: Verify the tag matches the product version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag.TrimStart('v')
          $actual = (Get-Item artifacts/publish-v4/Kms.App.exe).VersionInfo.ProductVersion
          if ($actual -ne $expected) {
            throw "Kms.App.exe reports $actual but tag $tag expects $expected."
          }
          Write-Host "version check passed: $expected"

      - name: Compose release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $note = "docs/releases/$tag.md"
          if (Test-Path $note) {
            Copy-Item $note release-body.md
          } else {
            "KeyMouseStats $tag" | Set-Content -Encoding UTF8 release-body.md
          }
          Compress-Archive -Path artifacts/publish-v4/Kms.App.exe `
            -DestinationPath "artifacts/publish-v4/Kms.App-$tag-win-x64.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/publish-v4/Kms.App.exe
          artifacts/publish-v4/Kms.App-${{ github.ref_name }}-win-x64.zip
          --title "KeyMouseStats ${{ github.ref_name }}"
          --notes-file release-body.md
