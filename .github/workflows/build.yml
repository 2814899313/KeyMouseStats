name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run before the build so a broken commit fails fast. --logic-only skips
      # RenderDashboard and ThemePerf, which need an interactive desktop session.
      - name: Run logic tests
        shell: cmd
        run: test.bat --logic-only

      - name: Build release executable
        shell: cmd
        run: build.bat

      - name: Build clean edition
        shell: cmd
        run: build-clean.bat

      - name: Verify clean edition
        shell: powershell
        run: |
          $file = Get-Item KeyMouseStats.Clean.exe
          if ($file.Length -gt 2MB) { throw "Clean edition unexpectedly exceeds 2 MiB." }
          $assembly = [Reflection.Assembly]::LoadFile($file.FullName)
          if ($assembly.GetManifestResourceNames().Count -ne 0) { throw "Clean edition contains embedded managed resources." }
          # Read the expected version from its single source so a release no longer
          # requires editing this workflow by hand.
          $expected = (Select-String -Path AssemblyInfo.cs -Pattern 'AssemblyFileVersion\("([\d.]+)"\)').Matches[0].Groups[1].Value
          if ($file.VersionInfo.FileVersion -ne $expected) { throw "Clean edition reports $($file.VersionInfo.FileVersion) but AssemblyInfo.cs declares $expected." }

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: KeyMouseStats-${{ github.sha }}
          path: |
            KeyMouseStats.exe
            KeyMouseStats.Clean.exe
          if-no-files-found: error
