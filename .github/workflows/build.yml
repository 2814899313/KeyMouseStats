name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release executable
        shell: cmd
        run: build.bat

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: KeyMouseStats-${{ github.sha }}
          path: KeyMouseStats.exe
          if-no-files-found: error
